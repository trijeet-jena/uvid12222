<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Custom A4 text design sheet</title>
  <desc id="desc">A white portrait page with sample customisable text.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#53665c" flood-opacity=".18"/>
    </filter>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f9f8f3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" rx="36" fill="#edf4ee"/>
  <circle cx="320" cy="320" r="248" fill="#e2efe5"/>
  <g filter="url(#shadow)" transform="rotate(-5 320 320)">
    <rect x="185" y="85" width="270" height="470" rx="10" fill="url(#paper)" stroke="#d9dfd8" stroke-width="3"/>
    <path d="M218 149h204M218 172h145" fill="none" stroke="#d9e6dc" stroke-width="4" stroke-linecap="round"/>
    <text x="320" y="267" text-anchor="middle" fill="#246a4d" font-family="Georgia,serif" font-size="35" font-weight="700">Your words</text>
    <path d="M240 293h160" fill="none" stroke="#e9a260" stroke-width="5" stroke-linecap="round"/>
    <text x="320" y="340" text-anchor="middle" fill="#51645a" font-family="Arial,sans-serif" font-size="18">Make it yours</text>
    <text x="320" y="370" text-anchor="middle" fill="#51645a" font-family="Arial,sans-serif" font-size="18">on an A4 sheet</text>
    <path d="M218 446h204M218 468h204M218 490h145" fill="none" stroke="#e2e7e1" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
